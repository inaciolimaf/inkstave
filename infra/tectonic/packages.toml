# infra/tectonic/packages.toml
#
# Package settings. Exactly what reads each key (checked against the code):
#
#   [bundle] format       READ by the worker at startup and handed to the runner, which stores it
#                         and never uses it: the Tectonic command always passes `--outfmt pdf`.
#   [packages] prewarm    READ by scripts/build_completion_packages.py, which builds the
#                         editor's package-completion list. NOT read by the Docker warm-up:
#                         infra/tectonic/Dockerfile carries its own \usepackage list, kept in
#                         sync by hand.
#
# Parsed but NOT used at runtime. Use the setting named here instead:
#   [bundle] url                 -> TECTONIC_BUNDLE_URL (the worker reads that setting only)
#   [cache] dir                  -> TECTONIC_CACHE_DIR
#   [cache] prewarm_on_build     -> nothing reads it; the warm-up lives in infra/tectonic/Dockerfile
#   [policy] allow_network_fetch -> NOT enforced; TECTONIC_OFFLINE=true is what stops network fetches

[bundle]
# Not read (see the header). Set TECTONIC_BUNDLE_URL to pin a bundle.
url = ""
format = "latex"         # read, stored, no effect (see the header)

[cache]
# Not read (see the header). Set TECTONIC_CACHE_DIR instead.
dir = ""
# Not read by anything. The image warm-up in infra/tectonic/Dockerfile does the prewarm.
prewarm_on_build = true

[packages]
# The package list the editor's completion data is built from (READ by
# scripts/build_completion_packages.py). The Docker warm-up keeps its own copy.
prewarm = [
  "amsmath",
  "amsfonts",
  "amssymb",
  "geometry",
  "graphicx",
  "hyperref",
  "babel",
  "inputenc",
  "fontenc",
  "xcolor",
  "booktabs",
  "caption",
  "enumitem",
  "listings",
]

[policy]
# Not enforced (see the header). For an offline deployment set TECTONIC_OFFLINE=true.
allow_network_fetch = true

# -------------------------------------------------------------------------------
# How to add a package
# -------------------------------------------------------------------------------
#   1. Add the package to the [packages] `prewarm` list above.
#   2. Add it to the \usepackage list in infra/tectonic/Dockerfile (the warm-up step).
#   3. Run `python scripts/build_completion_packages.py` so the editor offers it.
#   4. Rebuild the `inkstave-tectonic` image. Tectonic still resolves transitive dependencies
#      automatically, so list only the top-level package a document \usepackage's.
