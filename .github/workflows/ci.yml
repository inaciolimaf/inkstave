name: CI

# Every step is a Makefile target, so a green `make` is a green CI.
#
# Job graph: `lint` and `typecheck` run in parallel (no shared artifact). The three
# test stages — `unit`, `integration`, `e2e` — each depend only on `typecheck`, so they
# fan out and run concurrently; each provisions whatever it needs (integration: a
# Postgres service; e2e: docker-compose.test.yml). The `budget` job depends on all
# three: it fails the build if their combined wall-clock exceeds the 120 s budget,
# parsing the stages' JUnit XML so the slow-test detector runs on real durations, and
# applies the backend coverage floor to unit + integration together.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit, for `-o pipefail`: the default shell lets a pipe hide a failing gate.
    shell: bash

jobs:
  # --- Stage 1: lint --------------------------------------------------------- #
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make install-backend
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make install-web
      - name: Backend lint
        run: make lint
      - name: Documentation matches the code
        run: make docs
      - name: Frontend lint
        run: make web-lint

  # --- Stage 2: type-check --------------------------------------------------- #
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    # Independent of lint (no shared artifact); runs in parallel with it.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make install-backend
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make install-web
      - name: mypy
        run: make types
      - name: tsc
        run: make web-typecheck
      - name: API contract is up to date
        run: make web-types-check

  # --- Stage 3: unit (fakes only, no real services) -------------------------- #
  unit:
    name: Unit
    runs-on: ubuntu-latest
    # Depends only on typecheck; runs in parallel with the integration job.
    needs: typecheck
    outputs:
      seconds: ${{ steps.measure.outputs.seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make install-backend
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make install-web
      - name: Run unit tests (pytest unit subset + Vitest with coverage)
        id: measure
        run: scripts/measure_stage.sh make test-unit web-coverage
      - uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: test-results/
          if-no-files-found: error

  # --- Stage 4: integration (ephemeral Postgres; Redis is faked) ------------- #
  integration:
    name: Integration
    runs-on: ubuntu-latest
    # Depends only on typecheck (no unit artifact needed); runs in parallel with unit.
    needs: typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkstave
          POSTGRES_PASSWORD: inkstave
          POSTGRES_DB: inkstave
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inkstave"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://inkstave:inkstave@localhost:5432/inkstave_test
    outputs:
      seconds: ${{ steps.measure.outputs.seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make install-backend
      - name: Run integration tests
        id: measure
        run: scripts/measure_stage.sh make test-integration
      - uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: test-results/
          if-no-files-found: error

  # --- Stage 5: e2e (Playwright smoke; LLM + compile stubbed per spec 54) ----- #
  e2e:
    name: E2E (smoke)
    runs-on: ubuntu-latest
    # Starts its own Postgres + Redis (docker-compose.test.yml); needs no
    # unit/integration artifact, so it depends only on typecheck and runs alongside them.
    needs: typecheck
    outputs:
      seconds: ${{ steps.measure.outputs.seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make install-backend
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make install-web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}
      - name: Install Chromium
        run: make e2e-install
      - name: Start e2e infra (Postgres + Redis)
        run: make e2e-infra
      - name: Run Playwright smoke
        id: measure
        run: scripts/measure_stage.sh make e2e-smoke

  # --- Budget gate: unit + integration + e2e must be < 120 s ----------------- #
  budget:
    name: Budget and coverage gates
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make install-backend
      - name: Download unit results
        uses: actions/download-artifact@v4
        with:
          name: unit-results
          path: test-results
      - name: Download integration results
        uses: actions/download-artifact@v4
        with:
          name: integration-results
          path: test-results
      - name: Enforce the 120 s budget
        env:
          UNIT_S: ${{ needs.unit.outputs.seconds }}
          INTEGRATION_S: ${{ needs.integration.outputs.seconds }}
          E2E_S: ${{ needs.e2e.outputs.seconds }}
        run: make budget | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Backend coverage floor (unit + integration)
        run: make coverage-combine
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: test-results/coverage.xml
          if-no-files-found: ignore
