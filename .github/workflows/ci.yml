name: CI

# Every step is a Makefile target, so a green `make` is a green CI.
#
# Job graph: lint, typecheck, unit, web-unit, the integration shards and the e2e shards run side by side, with no
# `needs` between them. `budget` reads the unit and integration outputs (per-test limit and the
# coverage floor). `gate` needs every one of them: it fails on any job that did not succeed and
# when the run's wall clock, from its first job's start, passes 180 s (docs/system/overview.md).
# The `mutation` job stays outside the gate: it is slow by design and gates its own score.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit, for `-o pipefail`: the default shell lets a pipe hide a failing gate.
    shell: bash

env:
  # coverage.py on sys.monitoring (Python >= 3.12): far lighter than the trace function.
  COVERAGE_CORE: sysmon

jobs:
  # --- Lint: backend and frontend lint, docs, fix-commit rule, bundle budget -- #
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the fix-test rule reads the commits of the pushed or pull-request range.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false # the post-job prune took up to 108 s
      - run: make install-backend
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make install-web
      - name: Backend lint
        run: make lint
      - name: Documentation matches the code
        run: make docs
      - name: Every fix commit changes a test
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          make fix-tests FIX_RANGE="$range"
      - name: Frontend lint
        run: make web-lint
      - name: Initial JS stays within the budget
        run: make web-build web-budget

  # --- Type-check: mypy, tsc, and the API contract ---------------------------- #
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false
      - run: make install-backend
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make install-web
      - name: mypy
        run: make types
      - name: tsc
        run: make web-typecheck
      - name: API contract is up to date
        run: make web-types-check

  # --- Unit: backend unit tier --------------------------------------------- #
  unit:
    name: Unit (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false
      - run: make install-backend
      - name: Run the backend unit tier
        run: make test-unit
      - uses: actions/upload-artifact@v7
        with:
          name: unit-results
          path: test-results/
          if-no-files-found: error

  # --- Web unit: Vitest with its coverage floor, a job of its own for time ---- #
  web-unit:
    name: Unit (web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make install-web
      - name: Run Vitest with coverage
        run: make web-coverage

  # --- Integration: backend integration tier against a throwaway Postgres ----- #
  # Three shards: the tier alone takes about 220 s on one runner (the whole run has 180 s).
  integration:
    name: Integration (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkstave
          POSTGRES_PASSWORD: inkstave
          POSTGRES_DB: inkstave
        ports: ["5432:5432"]
        # The data lives in memory: the CI database is thrown away anyway.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U inkstave"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://inkstave:inkstave@localhost:5432/inkstave_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false
      - run: make install-backend
      - name: Run integration tests
        run: make test-integration SHARD=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        with:
          name: integration-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: error

  # --- E2E: Playwright smoke tier, in two shards, each with its own infra ----- #
  e2e:
    name: E2E (smoke, shard ${{ matrix.shard }}/2)
    # Pinned: Playwright 1.60 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false
      - run: make install-backend
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make install-web
      # The runner ships Google Chrome; Playwright uses it (channel "chrome"), so no browser download.
      - name: Start e2e infra (Postgres + Redis)
        run: make e2e-infra
      - name: Run Playwright smoke (shard ${{ matrix.shard }} of 2)
        run: make e2e-smoke E2E_ARGS="--shard=${{ matrix.shard }}/2"
      - name: Keep the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: frontend/test-results/
          if-no-files-found: ignore

  # --- Mutation testing: the functions this change touched (make mutation) --- #
  # Outside the gate: it is not in the `gate` job's needs, so it never adds to the 180 s. Red when a tier
  # scores below its minimum or the unit tests it runs pass 5 s; a run past 270 s only warns.
  mutation:
    name: Mutation testing (changed functions)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the merge base must be in the clone
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make install-backend
      - name: mutmut on the changed functions
        env:
          # Pull request: against the base branch. Push: against the previous tip of main
          # (HEAD~1 when the branch is new and the event carries no previous tip).
          MUTATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before == '0000000000000000000000000000000000000000' && 'HEAD~1' || github.event.before) }}
        run: |
          rc=0
          timeout 270 make mutation || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::warning::mutation testing hit 270 s; run make mutation locally"
            exit 0
          fi
          exit "$rc"

  # --- Budget: per-test limit and the backend coverage floor ----------------- #
  budget:
    name: Budget and coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: false
      - run: make install-backend
      - name: Download unit results
        uses: actions/download-artifact@v8
        with:
          name: unit-results
          path: test-results
      - name: Download integration results (every shard)
        uses: actions/download-artifact@v8
        with:
          pattern: integration-results-*
          merge-multiple: true
          path: test-results
      - name: Enforce the per-test limit
        run: make budget | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Backend coverage floor (unit + integration)
        # Runs even when the per-test gate fails, so one red gate cannot hide the other.
        if: ${{ !cancelled() }}
        run: make coverage-combine
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: test-results/coverage.xml
          if-no-files-found: ignore

  # --- Gate: every job succeeded, and the whole run took at most 180 s -------- #
  gate:
    name: Gate (all jobs, 180 s wall clock)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, typecheck, unit, web-unit, integration, e2e, budget]
    if: always()
    permissions:
      actions: read # to read the run's start time
    env:
      NEEDS: ${{ toJSON(needs) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Every job succeeded
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null || {
            echo "::error::a job did not succeed"
            exit 1
          }
      - name: At most 180 s from the start of the run until here
        run: |
          start=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq .run_started_at)
          total=$(( $(date +%s) - $(date -u -d "$start" +%s) ))
          echo "run took ${total}s (queue time included; limit 180s)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt 180 ]; then
            echo "::error::CI took ${total}s; the limit is 180s"
            exit 1
          fi
